<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Product Gallery</title>
    <script async src="script.js"></script>
    <style>
        .container{
            width:100%;
            height: auto;
            display: flex;
            padding-left: 40px;
            flex-wrap: wrap;
            gap: 40px;
        }
        .card{
            width: 300px;
            height: auto;
            padding: 8px;
            border: 1px solid;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .createcard{
            margin-top: 30px;
            background-color: green;
            color: white;
            padding: 8px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
        }
        .createcard:hover{
            background-color: rgb(39, 201, 147);
        }
    </style>
</head>
<body>
    
</body>
</html>
