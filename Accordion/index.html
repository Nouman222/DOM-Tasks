<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple Accordion</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="accordion">
    
    <div class="accordion-item">
      <button class="accordion-header">What is HTML?</button>
      <div class="accordion-content">
        <p>HTML is used to structure web pages.</p>
      </div>
    </div>

    <div class="accordion-item">
      <button class="accordion-header">What is CSS?</button>
      <div class="accordion-content">
        <p>CSS is used to style web pages.</p>
      </div>
    </div>

    <div class="accordion-item">
      <button class="accordion-header">What is JavaScript?</button>
      <div class="accordion-content">
        <p>JavaScript is used to make web pages interactive.</p>
      </div>
    </div>

    <div class="accordion-item">
        <button class="accordion-header">What is DOM</button>
        <div class="accordion-content">
            <p>DOM stand for Document Object Model</p>
        </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
